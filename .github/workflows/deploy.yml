name: Deploy to Cloudflare R2
on:
  push:
    branches: [ "master" ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "r2-deploy"
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    container: fedora:rawhide
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install gpg
        run: "dnf install -y gpg git rpm-sign"
      - name: "Import GPG key for signing commits"
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.ACTION_COMMIT_SING_PRIVATE_KEY }}
          passphrase: ${{ secrets.ACTION_COMMIT_SING_PASS }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true
      - name: Install createrepo_c
        run: |
          gpg --export --armor contact@madladsquad.com > my_key
          rpm --import my_key
          
          dnf install -y rpmdevtools createrepo_c curl

          echo "----------"
          pwd
          echo "----------"
          ls -a
          echo "----------"
          
          ln -s "$(pwd)/" ~/rpmbuild
          rpmdev-setuptree
          createrepo_c --update .

          KEY_ID=$(gpg --list-secret-keys --keyid-format=long | awk '/^sec/{print $2}' | cut -d'/' -f2)
          echo "%_gpg_name ${KEY_ID}" >> ~/.rpmmacros
          gpg --armor --export ${KEY_ID} > rpmkey.pub
          
          for spec in SPECS/*.spec; do
            spectool -g -R "${spec}"
          done
      - name: Installing packages
        run: |
          bash install-packages.sh
      - name: Copy RPMs
        run: |
          createrepo_c --update .
          gpg --detach-sign --armor repodata/repomd.xml

          rm *.sh README.md LICENSE .gitignore
      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PACKAGE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PACKAGE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: "untitled-desktop-rpms"
        run: |
          dnf install -y awscli2
          aws s3 sync . "s3://${R2_BUCKET}" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "my_key"
